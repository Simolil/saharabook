<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Golden Tent Gradient -->
    <linearGradient id="goldTent" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Golden Top Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.15" />

  <!-- Tent Silhouette with Glow -->
  <g filter="url(#softGlow)">
    <!-- Main Tent Geometry -->
    <path 
      d="
        M 256,88
        C 264,88 274,96 281,108
        L 426,382
        C 432,393 426,408 412,408
        L 326,408
        C 316,408 308,401 303,391
        L 256,278
        L 209,391
        C 204,401 196,408 186,408
        L 100,408
        C 86,408 80,393 86,382
        L 231,108
        C 238,96 248,88 256,88
        Z
      "
      fill="url(#goldTent)"
    />

    <!-- Inner Shadow & Dimension -->
    <path 
      d="
        M 256,88
        C 264,88 274,96 281,108
        L 426,382
        C 432,393 426,408 412,408
        L 326,408
        C 316,408 308,401 303,391
        L 256,278
        L 209,391
        C 204,401 196,408 186,408
        L 100,408
        C 86,408 80,393 86,382
        L 231,108
        C 238,96 248,88 256,88
        Z
      "
      fill="none"
      stroke="#B45309"
      stroke-width="6"
      stroke-linejoin="round"
      opacity="0.5"
    />
  </g>
</svg>
