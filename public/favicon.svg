<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Desert Sunset Sky Gradient -->
    <linearGradient id="desertSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="35%" stop-color="#F57C00" />
      <stop offset="70%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <!-- Subtle Golden Border -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E65100" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Favicon Tile for Browser Tab and Mobile Display -->
  <rect width="128" height="128" rx="26" fill="url(#desertSunset)" />
  <rect x="1" y="1" width="126" height="126" rx="25" fill="none" stroke="url(#tileBorder)" stroke-width="2" />

