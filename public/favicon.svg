<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Soft Squircle Clip -->
    <clipPath id="squircleClip">
      <rect width="256" height="256" rx="58" />
    </clipPath>

    <!-- Warm Dune Gradients -->
    <linearGradient id="duneLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89B55" />
      <stop offset="60%" stop-color="#DE823A" />
      <stop offset="100%" stop-color="#CF6E28" />
    </linearGradient>

    <linearGradient id="duneShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C76126" />
      <stop offset="100%" stop-color="#9C4415" />
    </linearGradient>

    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAE2C" />
      <stop offset="100%" stop-color="#F58F10" />
    </radialGradient>
  </defs>

  <!-- Background Squircle Tile -->
  <rect width="256" height="256" rx="58" fill="#F6EFE6" />

  <!-- The "D" Monogram Composition -->
  <g clip-path="url(#squircleClip)">
    
    <!-- Interior Sky / Counter Area of "D" -->
    <path d="M 62,64 L 148,64 C 188,64 202,96 202,132 C 202,170 186,200 144,200 L 62,200 Z" fill="#FBF7F0" />

    <!-- Golden Sun inside the "D" -->
    <circle cx="148" cy="112" r="19" fill="url(#sunGrad)" />

    <!-- Back Desert Dune Crest & Shadow inside the "D" -->
    <path d="M 138,140 C 145,148 160,158 178,168 L 168,200 L 98,200 Z" fill="url(#duneShadow)" />

    <!-- Front Rolling Dunes -->
    <path d="M 62,174 C 74,166 102,148 138,140 C 166,160 178,172 178,200 L 62,200 Z" fill="url(#duneLight)" />
    <!-- Lower Sand Wave filling bottom of D -->
    <path d="M 62,174 C 92,154 135,148 178,172 L 178,200 L 62,200 Z" fill="url(#duneLight)" />

    <!-- Two Palm Trees in Deep Pine Green -->
    <!-- Tall Palm Tree -->
    <g fill="#1E3A34" stroke="#1E3A34" stroke-linecap="round">
      <!-- Trunk -->
      <path d="M 94,152 Q 95,134 97,118 Q 99,134 96,152 Z" stroke-width="1" />
      <!-- Fronds -->
      <path d="M 97,118 Q 87,114 83,120" stroke-width="2.5" fill="none" />
      <path d="M 97,118 Q 89,109 88,114" stroke-width="2.5" fill="none" />
      <path d="M 97,118 Q 97,107 101,109" stroke-width="2.5" fill="none" />
      <path d="M 97,118 Q 106,109 110,115" stroke-width="2.5" fill="none" />
      <path d="M 97,118 Q 108,116 112,122" stroke-width="2.5" fill="none" />
    </g>

    <!-- Shorter Palm Tree -->
    <g fill="#1E3A34" stroke="#1E3A34" stroke-linecap="round">
      <!-- Trunk -->
      <path d="M 109,146 Q 110,138 112,128 Q 114,138 111,146 Z" stroke-width="0.8" />
      <!-- Fronds -->
      <path d="M 112,128 Q 105,124 102,129" stroke-width="2" fill="none" />
      <path d="M 112,128 Q 107,120 106,124" stroke-width="2" fill="none" />
      <path d="M 112,128 Q 115,119 117,121" stroke-width="2" fill="none" />
      <path d="M 112,128 Q 120,121 122,126" stroke-width="2" fill="none" />
      <path d="M 112,128 Q 120,127 123,132" stroke-width="2" fill="none" />
    </g>

    <!-- Bold Letter "D" Silhouette (Deep Pine Green) -->
    <!-- Cut with Flight Path at the top right -->
    <path d="
      M 62,64
      H 148
      C 156,64 163,66 170,70
      L 155,83
      C 152,83 148,83 144,83
      H 84
      V 181
      H 62
      Z
    " fill="#1E3A34" />

    <!-- Left Vertical Stem of D -->
    <rect x="62" y="64" width="22" height="136" rx="3" fill="#1E3A34" />

    <!-- Right Curve of D -->
    <path d="
      M 174,75
      C 188,88 202,108 202,134
      C 202,176 174,200 138,200
      L 96,200
      C 134,200 178,188 178,136
      C 178,106 166,88 156,83
      L 174,75
      Z
    " fill="#1E3A34" />

    <!-- Flight Trail Notch through Top of D -->
    <path d="M 152,84 Q 164,80 174,74 Q 170,70 156,82 Z" fill="#F6EFE6" />

    <!-- Ascending Airplane Silhouette at Top Right -->
    <g transform="translate(196, 68) rotate(35) scale(0.9)" fill="#1E3A34">
      <!-- Fuselage -->
      <path d="M 0,-14 C 1.8,-14 2.8,-10 2.8,-2 L 2.8,12 C 2.8,13.5 1.5,14.5 0,14.5 C -1.5,14.5 -2.8,13.5 -2.8,12 L -2.8,-2 C -2.8,-10 -1.8,-14 0,-14 Z" />
      <!-- Main Wings -->
      <path d="M 0,-2 L 14,5 L 14,8 L 0,3 L -14,3 L -14,0 L 0,-2 Z" />
      <!-- Tail Wings -->
      <path d="M 0,10 L 6,13.5 L 6,15 L 0,13.5 L -6,15 L -6,13.5 Z" />
    </g>

  </g>
</svg>