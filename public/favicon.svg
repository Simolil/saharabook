<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080F22" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="70%" stop-color="#EF9F27" />
      <stop offset="100%" stop-color="#BA7517" />
    </radialGradient>

    <!-- Front Dune Gradient -->
    <linearGradient id="frontDuneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF9F27" />
      <stop offset="60%" stop-color="#BA7517" />
      <stop offset="100%" stop-color="#8C530A" />
    </linearGradient>

    <!-- Back Dune Gradient -->
    <linearGradient id="backDuneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA7517" />
      <stop offset="100%" stop-color="#6F3F05" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with subtle gold border -->
  <rect width="64" height="64" rx="15" fill="url(#skyGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Glowing Desert Sun / Moroccan Star Motif -->
  <circle cx="43" cy="20" r="7.5" fill="url(#sunGrad)" />
  <circle cx="43" cy="20" r="11" fill="#FFD166" opacity="0.18" />

  <!-- Moroccan 8-point Zellij Star Accent in Sky -->
  <g transform="translate(18, 17) scale(0.12)">
    <path d="M50 0l10 30h30l-25 20 10 30-25-20-25 20 10-30-25-20h30z" fill="#FFD166" opacity="0.85" />
  </g>

  <!-- Back Sahara Dune (Erg Chebbi) -->
  <path d="M4 52 C14 36 28 32 42 41 C51 47 56 46 60 44 L60 52 C60 56.4 56.4 60 52 60 L12 60 C7.6 60 4 56.4 4 52 Z" fill="url(#backDuneGrad)" opacity="0.9" />

  <!-- Front Sweeping Dune with the Brand's Signature Wave & Crest Curve -->
  <path d="M4 52 C10 44 22 36 34 43 C42 48 50 43 60 37 L60 52 C60 56.4 56.4 60 52 60 L12 60 C7.6 60 4 56.4 4 52 Z" fill="url(#frontDuneGrad)" />

  <!-- Stylized Ridge Line (Echoing the Logo's Umbrella Wave) -->
  <path d="M4 52 Q 18 36, 34 43 T 60 37" fill="none" stroke="#FFE3A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>
